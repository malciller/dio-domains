# docker compose file for the published dio image. Also on Docker Hub as
# malciller/dio-domains; swap the image names below if you pull from there.
#
# The image ships without a configuration. Extract the examples and edit them
# for the venue(s) you trade:
#
#   IMAGE=ghcr.io/malciller/dio-domains:latest   # or: malciller/dio-domains:latest
#   docker run --rm -v "$PWD:/out" --entrypoint cp $IMAGE \
#     /usr/share/doc/dio/config.example.json /out/config.json
#   docker run --rm -v "$PWD:/out" --entrypoint cp $IMAGE \
#     /usr/share/doc/dio/.env.example /out/.env
#
# Then:
#
#   docker compose up -d            # start the engine
#   docker compose run --rm dashboard   # attach the TUI dashboard
#
# The dashboard is behind the "dashboard" profile so a plain `up` starts only
# the engine. Both containers share the Unix domain socket volume that the
# dashboard uses to talk to the engine.

name: dio

services:
  engine:
    image: ghcr.io/malciller/dio-domains:latest
    platform: linux/amd64
    container_name: dio_engine
    restart: unless-stopped
    command: ["dio"]
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      - ./config.json:/app/config.json:ro
      - ./.env:/app/.env:ro
      - dio-data:/app/data
      - dio-sock:/var/run/dio
    environment:
      TERM: xterm-256color
      DIO_CANARY: "0"
      # The entrypoint starts dio-persist as a sidecar of this container (same /app/data
      # volume, same /tmp for the socket) so the state-file fsync and rename happen
      # outside the trading process's OCaml 5 runtime. Set to "0" to run with in-process
      # persistence, i.e. the previous behaviour.
      DIO_PERSIST: "1"
    ports:
      - "8080:8080"
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  dashboard:
    image: ghcr.io/malciller/dio-domains:latest
    platform: linux/amd64
    profiles: ["dashboard"]
    depends_on:
      - engine
    command: ["dio-dashboard"]
    stdin_open: true
    tty: true
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      - ./config.json:/app/config.json:ro
      - dio-sock:/var/run/dio
    environment:
      TERM: xterm-256color
      DIO_CANARY: "0"

volumes:
  dio-data:
  dio-sock:
