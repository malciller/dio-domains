name: ci
on: [push, pull_request]

jobs:
  build-test:
    runs-on: ubuntu-22.04
    permissions:
      actions: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install system build dependencies
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
               bubblewrap g++-multilib gcc-multilib m4 make mercurial \
               musl-tools rsync autoconf automake libtool

      - name: Build libsecp256k1 with schnorrsig support
        run: |
          rm -rf /tmp/secp256k1
          git clone https://github.com/bitcoin-core/secp256k1.git /tmp/secp256k1
          cd /tmp/secp256k1
          ./autogen.sh
          ./configure --enable-module-schnorrsig --enable-module-recovery
          make
          sudo make install
          sudo ldconfig

      - name: Set up opam and OCaml 5.2.0
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y opam
          opam init --bare --disable-sandboxing -y --no-setup
          if ! opam switch list --short 2>/dev/null | grep -qx "default"; then
            opam switch create default ocaml-base-compiler.5.2.0
          fi
          eval "$(opam env --switch default)"

      - name: Restore Dune cache
        if: github.server_url == 'https://github.com'
        uses: actions/cache@v4
        with:
          path: ~/.cache/dune
          key: ${{ runner.os }}-dune-cache-${{ hashFiles('**/*.opam', 'dune-project', 'dune') }}
          restore-keys: |
            ${{ runner.os }}-dune-cache-

      - name: Install opam deps
        run: opam install . --deps-only --with-test -y

      - name: Build
        run: opam exec -- dune build @all

      - name: Run tests
        run: opam exec -- dune runtest