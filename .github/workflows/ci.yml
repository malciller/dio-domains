name: ci
on:
  push:
    branches: ["**"]
    # Tags are release gates: build-test-oxcaml on the exact commit that the
    # release workflow waits for before publishing a GitHub Release.
    tags: ["v*"]
  pull_request:

jobs:
  build-test-oxcaml:
    # OxCaml (flambda2) build + tests, using the split image process:
    # Dockerfile.base builds the OxCaml compiler + all opam deps (slow, changes
    # rarely), and Dockerfile builds the engine on top of it (fast). The base
    # image is cached between CI runs so day-to-day builds never recompile the
    # compiler.
    #
    # This is the only toolchain: the engine uses OxCaml features (`local_`
    # signature mode) and runtime symbols (`caml_minor_words_allocated`) that
    # stock OCaml does not provide, so there is no classic-flambda job.
    #
    # Requires a runner with Docker and >= 16 GB RAM for the first (uncached)
    # base build: the OxCaml compiler bootstrap OOMs at 8 GB. On the
    # self-hosted Gitea runner, `runs-on` must name a label whose runner has
    # both; change it if needed.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DIO_BASE_IMAGE: dio-oxcaml-base:5.2.0minus40

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Guard against committed .env files
        # The real .env is gitignored; only .env.example may be committed.
        # This catches an accidental `git add -f .env` or a stray variant.
        run: |
          tracked=$(git ls-files | grep -E '(^|/)\.env(\.[^/]*)?$' \
            | grep -vE '\.env\.(example|sample|template)$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::committed environment file(s):"
            echo "$tracked"
            exit 1
          fi
          echo "no committed .env files"

      - name: Guard against server-side cohttp use
        # The OxCaml build pins cohttp below the CVE-2026-82481 server-side
        # path-traversal fix so the dependency closure resolves against the
        # OxCaml compiler. dio only uses cohttp as a client, so the vulnerable
        # code is unreachable. This fails if server-side file serving appears,
        # because then the pin would no longer be safe.
        run: |
          if grep -rEn 'Cohttp_lwt_unix\.Server|Cohttp_lwt\.Server|resolve_local_file|resolve_file' src bin; then
            echo "::error::cohttp < 6.0.0 is below CVE-2026-82481; server-side cohttp file serving is not allowed"
            exit 1
          fi
          echo "cohttp client-only guard passed"

      - name: Set up Buildx (GitHub-hosted runners)
        if: github.server_url == 'https://github.com'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # --- Base image (OxCaml compiler + opam deps) ---
      # On GitHub-hosted runners (ephemeral) the GitHub Actions cache backend
      # keeps the expensive compiler layer across runs. On the self-hosted Gitea
      # runner the Docker daemon persists, so its own layer cache is reused and
      # the `docker image inspect` guard skips a rebuild entirely.
      - name: Build OxCaml base image (GitHub-hosted runners)
        if: github.server_url == 'https://github.com'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile.base
          load: true
          tags: ${{ env.DIO_BASE_IMAGE }}
          # buildx's default gha cache key ("buildkit") is already shared across
          # refs, so PRs and tags read main's cache. The problem was every ref
          # writing its own ~3.4 GB copy: main + each PR + each tag blew past
          # GitHub's 10 GB/repo limit, the compiler layer was evicted LRU, and
          # each run paid the ~40 min rebuild. Only main writes now.
          cache-from: type=gha
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=min' || '' }}

      - name: Build OxCaml base image (self-hosted runner)
        if: github.server_url != 'https://github.com'
        # The self-hosted runner persists images between runs, so a reused base
        # image is only trusted when it carries a fingerprint of the inputs it
        # was built from. A stale or differently-built image (including one a
        # PR build left behind) fails the check and is rebuilt. This does not
        # stop an actor who can run docker commands on the runner directly; for
        # that, run untrusted pull requests on an ephemeral runner.
        run: |
          fingerprint=$( {
            cat Dockerfile.base dio.opam dune-project
            find oxcaml-port/opam-overlay -type f -print0 | sort -z | xargs -0 -r cat
          } | sha256sum | awk '{print $1}' )
          if docker image inspect "$DIO_BASE_IMAGE" \
               --format '{{ index .Config.Labels "dio.base.fingerprint" }}' 2>/dev/null \
             | grep -qx "$fingerprint"; then
            echo "Base image $DIO_BASE_IMAGE matches current inputs; skipping."
          else
            echo "Base image missing or inputs changed; building (slow) …"
            DOCKER_BUILDKIT=1 docker buildx build \
              --progress=plain \
              -f Dockerfile.base \
              --label "dio.base.fingerprint=$fingerprint" \
              -t "$DIO_BASE_IMAGE" \
              --load .
          fi

      # --- Application image (engine only) ---
      # Tag the builder stage for tests (it has opam + dune; the final runtime
      # stage is a minimal Ubuntu without a toolchain), and the full image
      # builds the release binaries.
      #
      # These run on the `default` (Docker daemon) builder on purpose. On
      # GitHub-hosted runners `setup-buildx-action` makes a docker-container
      # builder current, and `build-push-action`'s `load: true` exports the base
      # image into the Docker daemon's image store — not the container builder's
      # own store. Building here with the container builder cannot see the base
      # image, so `FROM dio-oxcaml-base:5.2.0minus40` fails to resolve locally,
      # BuildKit falls back to a registry reference (`docker.io/library/...`)
      # and the pull is denied. `--builder default` shares the daemon's image
      # store (this is also the builder the self-hosted Gitea runner uses, where
      # `setup-buildx-action` is skipped), so the base image resolves on both.
      - name: Build engine image
        run: |
          DOCKER_BUILDKIT=1 docker buildx build --builder default \
            --progress=plain \
            --build-arg "DIO_BASE_IMAGE=$DIO_BASE_IMAGE" \
            --target builder \
            -t dio-oxcaml-test \
            --load .
          DOCKER_BUILDKIT=1 docker buildx build --builder default \
            --build-arg "DIO_BASE_IMAGE=$DIO_BASE_IMAGE" \
            -t dio-oxcaml-app \
            --load .

      - name: Run test suite under OxCaml
        # `.dockerignore` excludes test/, so bind-mount it into the image for
        # the test run. Treats `Alert` output as a failure so the zero-alert
        # invariant is enforced by CI.
        run: |
          set -o pipefail
          docker run --rm \
            -v "$PWD/test:/app/test:ro" \
            --entrypoint bash \
            dio-oxcaml-test -lc \
            'eval $(opam env) && cd /app && cp -r test /tmp/test && dune runtest --force 2>&1' \
            | tee /tmp/oxcaml-test.log
          if grep -q "Alert " /tmp/oxcaml-test.log; then
            echo "::error::OxCaml build emitted compiler alerts; see log above"
            exit 1
          fi
