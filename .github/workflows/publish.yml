name: publish

# Builds the release image and pushes it to GitHub Container Registry, then
# mirrors it to Docker Hub when the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN
# repository secrets are set. The mirror is skipped when they are absent, so
# the release never depends on Docker Hub.
#
# The package must be public. If it is ever recreated private, set visibility
# back to public in the repository's package settings (Package settings ->
# Danger Zone -> change visibility); see docs/RISK.md.
#
# Tags published:
#   ghcr.io/<owner>/<repo>:<tag>   (the pushed tag, or the workflow_dispatch input)
#   ghcr.io/<owner>/<repo>:latest
#   docker.io/<DOCKERHUB_USERNAME>/dio-domains:<tag>    (when secrets are set)
#   docker.io/<DOCKERHUB_USERNAME>/dio-domains:latest

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (for example v0.1.0)"
        required: true
        type: string

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    # The OxCaml base bootstrap needs >= 16 GB RAM; GitHub-hosted
    # ubuntu-latest provides that. Same caveat as the CI workflow.
    runs-on: ubuntu-latest
    env:
      DIO_BASE_IMAGE: dio-oxcaml-base:5.2.0minus40
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Resolve image tag
        id: vars
        run: |
          tag="${{ github.event.inputs.tag }}"
          if [ -z "$tag" ]; then
            tag="${GITHUB_REF_NAME}"
          fi
          if ! printf '%s' "$tag" | grep -Eq '^[A-Za-z0-9._-]+$'; then
            echo "::error::invalid image tag: $tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Base image (OxCaml compiler + all opam deps). Reads the default gha
      # cache scope that ci.yml writes from main, so a release does not pay the
      # ~40 min compiler rebuild. No cache-to here: a tag-scoped write would
      # duplicate ~3.4 GB and overflow the 10 GB repo limit.
      - name: Build OxCaml base image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile.base
          load: true
          tags: ${{ env.DIO_BASE_IMAGE }}
          cache-from: type=gha

      # Application image. Built with the default (daemon) builder so it can
      # see the base image that the previous step loaded into the daemon's
      # image store rather than the container builder's (see ci.yml for the
      # full explanation of this split).
      - name: Build and push application image
        run: |
          DOCKER_BUILDKIT=1 docker buildx build --builder default \
            --progress=plain \
            --build-arg "DIO_BASE_IMAGE=$DIO_BASE_IMAGE" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "$IMAGE:${{ steps.vars.outputs.tag }}" \
            -t "$IMAGE:latest" \
            --push .

      # Optional mirror to Docker Hub (public registry search). Runs only when
      # the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets are set.
      # Create a Docker Hub access token with Read & Write scope.
      - name: Mirror to Docker Hub
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DH_USER" ] || [ -z "$DH_TOKEN" ]; then
            echo "Docker Hub secrets not set; skipping mirror."
            exit 0
          fi
          echo "$DH_TOKEN" | docker login -u "$DH_USER" --password-stdin
          tag="${{ steps.vars.outputs.tag }}"
          repo="docker.io/$DH_USER/dio-domains"
          docker image inspect "$IMAGE:$tag" >/dev/null 2>&1 || docker pull "$IMAGE:$tag"
          docker tag "$IMAGE:$tag" "$repo:$tag"
          docker tag "$IMAGE:$tag" "$repo:latest"
          docker push "$repo:$tag"
          docker push "$repo:latest"
          echo "Mirrored to $repo:$tag and $repo:latest"

      - name: Summary
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          {
            echo "### Published image"
            echo
            echo '```'
            echo "$IMAGE:${{ steps.vars.outputs.tag }}"
            echo "$IMAGE:latest"
            if [ -n "$DH_USER" ]; then
              echo "docker.io/$DH_USER/dio-domains:${{ steps.vars.outputs.tag }}"
              echo "docker.io/$DH_USER/dio-domains:latest"
            fi
            echo '```'
            echo
            echo "The package is public. If it is private, change visibility in"
            echo "the package settings; see docs/RISK.md."
          } >> "$GITHUB_STEP_SUMMARY"
