name: grant-image-access

# Two-step approval, driven by labels:
#
#   access-request   opened by the request form
#   access-approved  maintainer approves; pings the maintainer with the package
#                    settings link and assigns the issue. No requester output.
#   access-granted   maintainer has actually invited the account; posts the pull
#                    instructions for the requester and closes the issue.
#   access-denied    maintainer declines; replies briefly to the requester and
#                    closes the issue.
#
# The split exists because there is no API or event when package access is
# granted, so the workflow cannot verify the invite itself; the maintainer
# asserts it with the second label.

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

jobs:
  access:
    if: >-
      github.event.label.name == 'access-approved' ||
      github.event.label.name == 'access-granted' ||
      github.event.label.name == 'access-denied'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      MAINTAINER: ${{ github.repository_owner }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_BODY: ${{ github.event.issue.body }}
    steps:
      - name: Parse requested username
        id: who
        run: |
          username=$(python3 -c 'import os,re; b=os.environ.get("ISSUE_BODY",""); m=re.search(r"###\s*GitHub username\s*\n+([^\n]+)", b); print((m.group(1).strip() if m else "").lstrip("@"))')
          if [ -z "$username" ]; then
            echo "::error::could not parse a GitHub username from the issue body"
            exit 1
          fi
          case "$username" in
            *[!A-Za-z0-9-]*)
              echo "::error::unexpected username: $username"
              exit 1
              ;;
          esac
          echo "username=$username" >> "$GITHUB_OUTPUT"

      # access-approved: remind the maintainer, with the one-click link.
      - name: Ping maintainer
        if: github.event.label.name == 'access-approved'
        env:
          # Passed through the environment rather than interpolated into the
          # script, so a crafted username cannot inject shell syntax.
          REQ_USER: ${{ steps.who.outputs.username }}
        run: |
          username="$REQ_USER"
          gh issue comment "$ISSUE_NUMBER" --body \
            "@$MAINTAINER invite @$username (Read), then add the \`access-granted\` label: https://github.com/users/$MAINTAINER/packages/container/dio-domains/settings"
          gh issue edit "$ISSUE_NUMBER" --add-assignee "$MAINTAINER"

      # access-granted: the account is in, hand the requester the instructions.
      - name: Post pull instructions and close
        if: github.event.label.name == 'access-granted'
        env:
          REQ_USER: ${{ steps.who.outputs.username }}
        run: |
          username="$REQ_USER"
          gh issue comment "$ISSUE_NUMBER" --body-file - <<EOF
          Access granted for @$username.

          To pull the image:

          1. Create a personal access token (classic) with the \`read:packages\` scope:
             https://github.com/settings/tokens/new?scopes=read:packages
          2. Log in to the registry:

             \`\`\`sh
             echo "\$GHCR_PAT" | docker login ghcr.io -u $username --password-stdin
             \`\`\`

          3. Pull the image:

             \`\`\`sh
             docker pull ghcr.io/malciller/dio-domains:latest
             \`\`\`

          Then follow docs/DEPLOYMENT.md. If a pull is denied right after this
          message, wait a minute and try again.
          EOF
          gh issue close "$ISSUE_NUMBER" --reason completed

      # access-denied: decline and close.
      - name: Decline and close
        if: github.event.label.name == 'access-denied'
        env:
          REQ_USER: ${{ steps.who.outputs.username }}
        run: |
          username="$REQ_USER"
          gh issue comment "$ISSUE_NUMBER" --body \
            "Thanks for the request, @$username. We're not granting access to the prebuilt image right now."
          gh issue close "$ISSUE_NUMBER" --reason "not planned"
