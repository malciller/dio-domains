name: grant-image-access

# When a maintainer applies the "access-approved" label to an image-access
# request, this posts the pull instructions for the requester and then posts a
# short maintainer mention carrying the direct package-access link, so the
# approver gets the reminder (and the link) as a GitHub notification.
#
# The package settings URL works only for the account that owns the package, so
# exposing it on the issue is harmless. GitHub cannot attach custom text to an
# assignment notification, which is why the link goes in a mention comment.
#
# GitHub has no API to grant access to a package scoped to a personal account
# (only organization-scoped packages can be granted programmatically), so the
# invite stays a manual click for the owner.

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

jobs:
  grant:
    if: github.event.label.name == 'access-approved'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      MAINTAINER: ${{ github.repository_owner }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_BODY: ${{ github.event.issue.body }}
    steps:
      - name: Extract requested username
        id: who
        run: |
          username=$(python3 -c 'import os,re; b=os.environ.get("ISSUE_BODY",""); m=re.search(r"###\s*GitHub username\s*\n+([^\n]+)", b); print((m.group(1).strip() if m else "").lstrip("@"))')
          if [ -z "$username" ]; then
            echo "::error::could not parse a GitHub username from the issue body"
            exit 1
          fi
          case "$username" in
            *[!A-Za-z0-9-]*)
              echo "::error::unexpected username: $username"
              exit 1
              ;;
          esac
          echo "username=$username" >> "$GITHUB_OUTPUT"

      - name: Post pull instructions for the requester
        env:
          # Passed through the environment rather than interpolated into the
          # script, so a crafted username cannot inject shell syntax.
          REQ_USER: ${{ steps.who.outputs.username }}
        run: |
          username="$REQ_USER"
          case "$username" in
            *[!A-Za-z0-9-]*|'')
              echo "::error::unexpected username: $username"
              exit 1
              ;;
          esac

          gh issue comment "$ISSUE_NUMBER" --body-file - <<EOF
          Approved for @$username. A maintainer is adding your account; the image
          will pull once that is done.

          To pull it:

          1. Create a personal access token (classic) with the \`read:packages\` scope:
             https://github.com/settings/tokens/new?scopes=read:packages
          2. Log in to the registry:

             \`\`\`sh
             echo "\$GHCR_PAT" | docker login ghcr.io -u $username --password-stdin
             \`\`\`

          3. Pull the image:

             \`\`\`sh
             docker pull ghcr.io/malciller/dio-domains:latest
             \`\`\`

          Then follow docs/DEPLOYMENT.md. If the pull is denied, your account has
          not been added yet; wait a few minutes and try again.
          EOF

      - name: Notify maintainer and close
        env:
          REQ_USER: ${{ steps.who.outputs.username }}
        run: |
          username="$REQ_USER"
          gh issue comment "$ISSUE_NUMBER" --body \
            "@$MAINTAINER grant Read for @$username: https://github.com/users/$MAINTAINER/packages/container/dio-domains/settings"
          gh issue edit "$ISSUE_NUMBER" --add-assignee "$MAINTAINER"
          gh issue close "$ISSUE_NUMBER" --reason completed
